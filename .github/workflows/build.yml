
name: Build Axiom AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'AxiomAI.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;26.1.10909125"
          sdkmanager "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      
      - name: Extract project
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          echo "Extracted folders:"
          find source -maxdepth 3 -type f -name "settings.gradle*" -o -name "gradlew"

      - name: Build APK
        run: |
          cd source/android
          gradle :app:assembleDebug \
            --no-daemon --stacktrace

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAI-Build
          path: |
            source/android/app/build/outputs/apk/debug/*.apk
            source/android/app/build/reports/
          if-no-files-found: ignore
